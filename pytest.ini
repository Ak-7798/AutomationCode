[pytest]
# Test Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Configuration
console_output_style = progress
addopts = -v --tb=short --html=reports/report.html --self-contained-html --cov=. --cov-report=html:reports/coverage --alluredir=reports/allure-results

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
